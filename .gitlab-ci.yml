# Thin wrapper: all logic is in ci/run.sh, which also runs in a developer's shell.
#
# Maven registry with the mcp-contracts artifacts: MCP_MAVEN_REPOSITORY_URL, MCP_MAVEN_REPOSITORY_USER,
# MCP_MAVEN_REPOSITORY_PASSWORD, all three masked AND protected CI/CD variables, so merge request pipelines of unprotected
# branches never receive them (code of a merge request, including .ci/settings.xml, must not decide where credentials go).
# The merge request job runs offline against the cache, without the Docker socket. The default branch job starts
# PostgreSQL, Redis and OpenBao with Testcontainers: it needs a dedicated runner tagged docker-dedicated with the socket
# mounted, or DOCKER_HOST pointing at a Docker-in-Docker service.
stages:
  - verify

default:
  image: maven:3.9.12-eclipse-temurin-25
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Merge request code must not poison the cache the main job reads: its cache has another key and is pull-only.
# tags: an isolated runner without the Docker socket (runner isolation itself is M6).
unit:
  stage: verify
  tags: [isolated-no-docker]
  cache:
    key: maven-mr
    policy: pull
    paths: [.m2/repository]
  variables:
    MCP_MAVEN_OFFLINE: "true"
  script:
    - ci/run.sh unit
  artifacts:
    when: always
    reports:
      junit: "target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

verify:
  stage: verify
  cache:
    key: maven-main
    policy: pull-push
    paths: [.m2/repository]
  tags: [docker-dedicated]
  script:
    - ci/run.sh verify
  artifacts:
    when: always
    reports:
      junit: "target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
