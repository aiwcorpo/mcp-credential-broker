# No job needs a registry login or a secret: the mcp-contracts artifacts come from
# Maven Central. A pull request runs the tests that start no container, with a read-only token; the full run (Testcontainers)
# is for pushes to main.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  merge-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B verify '-Dtest=!*IntegrationTest'
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B verify
