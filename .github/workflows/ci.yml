# Thin wrapper: all logic is in ci/run.sh. Secrets MCP_MAVEN_REPOSITORY_URL, MCP_MAVEN_REPOSITORY_USER and
# MCP_MAVEN_REPOSITORY_PASSWORD (Environment ci-main, restricted to the main branch) point at the registry with the mcp-contracts artifacts.
name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ci/run.sh verify
        env:
          MCP_MAVEN_REPOSITORY_URL: ${{ secrets.MCP_MAVEN_REPOSITORY_URL }}
          MCP_MAVEN_REPOSITORY_USER: ${{ secrets.MCP_MAVEN_REPOSITORY_USER }}
          MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_MAVEN_REPOSITORY_PASSWORD }}
